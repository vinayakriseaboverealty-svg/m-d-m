# Rise Above Reality: Fleet MDM + Claude Code usage monitoring.
# Runs on one dedicated DigitalOcean droplet (not the HRMS cluster).
# Only Caddy is published to the internet; everything else stays on the internal network.
# Based on Fleet's docs/solutions/docker-compose, with pinned versions and a reverse proxy.

name: riseabove-mdm

volumes:
  mysql:
  redis:
  fleet-data:
  fleet-logs:
  fleet-vulndb:
  caddy-data:
  caddy-config:
  prometheus:
  grafana:

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - FLEET_DOMAIN=${FLEET_DOMAIN}
      - OTEL_DOMAIN=${OTEL_DOMAIN}
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  mysql:
    image: mysql:8.0.44
    restart: unless-stopped
    command:
      - mysqld
      # Required for storing large MDM payloads (Fleet's own dev compose uses the same value).
      - --max_allowed_packet=536870912
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=fleet
      - MYSQL_USER=fleet
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ufleet -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.6
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  fleet-init:
    image: alpine:3.22.2
    volumes:
      - fleet-logs:/logs
      - fleet-data:/data
      - fleet-vulndb:/vulndb
    command: sh -c "chown -R 100:101 /logs /data /vulndb"

  fleet:
    image: fleetdm/fleet:${FLEET_VERSION}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    # prepare db runs pending migrations on every start; it's a no-op when there are none.
    command: sh -c "/usr/bin/fleet prepare db --no-prompt && /usr/bin/fleet serve"
    environment:
      - FLEET_MYSQL_ADDRESS=mysql:3306
      - FLEET_MYSQL_DATABASE=fleet
      - FLEET_MYSQL_USERNAME=fleet
      - FLEET_MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - FLEET_REDIS_ADDRESS=redis:6379
      - FLEET_SERVER_ADDRESS=0.0.0.0:8080
      # Caddy terminates TLS.
      - FLEET_SERVER_TLS=false
      # Encrypts the Apple push certificate and other secrets in MySQL. Losing it means re-enrolling every device.
      - FLEET_SERVER_PRIVATE_KEY=${FLEET_SERVER_PRIVATE_KEY}
      - FLEET_SESSION_DURATION=24h
      - FLEET_LOGGING_JSON=true
      - FLEET_OSQUERY_STATUS_LOG_PLUGIN=filesystem
      - FLEET_OSQUERY_RESULT_LOG_PLUGIN=filesystem
      - FLEET_FILESYSTEM_STATUS_LOG_FILE=/logs/osqueryd.status.log
      - FLEET_FILESYSTEM_RESULT_LOG_FILE=/logs/osqueryd.results.log
      - FLEET_FILESYSTEM_ENABLE_LOG_ROTATION=true
      - FLEET_FILESYSTEM_ENABLE_LOG_COMPRESSION=true
      - FLEET_OSQUERY_LABEL_UPDATE_INTERVAL=1h
      - FLEET_VULNERABILITIES_CURRENT_INSTANCE_CHECKS=yes
      - FLEET_VULNERABILITIES_DATABASES_PATH=/vulndb
      - FLEET_VULNERABILITIES_PERIODICITY=6h
    volumes:
      - fleet-data:/fleet
      - fleet-logs:/logs
      - fleet-vulndb:/vulndb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Receives Claude Code telemetry (OTLP/HTTP, bearer-token protected) and exposes it to Prometheus.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - CLAUDE_OTEL_TOKEN=${CLAUDE_OTEL_TOKEN}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A year of history; 20 users of Claude Code is a few MB.
      - --storage.tsdb.retention.time=400d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
