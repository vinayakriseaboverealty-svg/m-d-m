# Fleet GitOps for Rise Above Reality (Fleet Free).
#
# Fleet Free has no fleets (teams): every host is "Unassigned", so everything in this file applies
# to every enrolled device. Policy automations, label targeting, software installers, FileVault
# enforcement, and remote lock/wipe are Premium-only and deliberately absent.
#
# Apply with fleetctl gitops (always --dry-run first); see ../docs/runbook.md.
# Required environment variables: FLEET_SERVER_URL, FLEET_ENROLL_SECRET,
# FLEET_SECRET_CLAUDE_OTEL_TOKEN, FLEET_SECRET_MACOS_ITADMIN_PASSWORD.
#
# Omitting a top-level key deletes everything in that section on the server.

agent_options:
  path: ./lib/all/agent-options.yml

org_settings:
  features:
    enable_host_users: true
    enable_software_inventory: true
  host_expiry_settings:
    host_expiry_enabled: false
  org_info:
    org_name: Rise Above Reality
  secrets:
    - secret: $FLEET_ENROLL_SECRET
  server_settings:
    server_url: $FLEET_SERVER_URL
    enable_analytics: false
    live_reporting_disabled: false
    scripts_disabled: false

policies:
  - paths: ./lib/macos/policies/*.yml
  - paths: ./lib/windows/policies/*.yml

reports:
  - paths: ./lib/all/reports/*.yml

controls:
  scripts:
    - paths: ./lib/macos/scripts/*.sh
    - paths: ./lib/windows/scripts/*.ps1
  apple_settings:
    configuration_profiles:
      - paths: ./lib/macos/configuration-profiles/*.mobileconfig
  # Windows MDM stays off: two Windows PCs are managed through fleetd (policies + scripts).
  windows_enabled_and_configured: false
