- name: Claude Code managed settings installed (Windows)
  query: |-
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\ClaudeCode'
      AND name = 'Settings'
      AND data LIKE '%CLAUDE_CODE_ENABLE_TELEMETRY%';
  critical: false
  description: Checks that the set-claude-code-managed-settings.ps1 script has written Claude Code's managed settings, so usage reporting is on.
  resolution: IT runs the "set-claude-code-managed-settings.ps1" script on this PC from Fleet.
  platform: windows
