- name: Application firewall enabled
  query: SELECT 1 FROM alf WHERE global_state >= 1;
  critical: false
  description: Checks that the macOS application firewall is on. The "Firewall" configuration profile turns it on.
  resolution: The firewall is turned on automatically by the MDM. If this fails, restart the Mac, then open Fleet Desktop and click Refetch. If it still fails, contact IT.
  platform: darwin
